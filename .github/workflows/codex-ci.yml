name: Codex compatibility

on:
  push:
    branches: [codex, "automation/**"]
  pull_request:
    branches: [codex]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-save --package-lock=false fast-check@4.5.3 commander@14.0.0
      - name: Fetch pinned TLC
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$RUNNER_TEMP/tla2tools.jar"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -
      - name: Test the complete installed suite
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools.jar
        run: node scripts/test-codex.mjs
      - name: Check whether this package has current real-model acceptance
        continue-on-error: true
        run: node scripts/check-codex.mjs --release
