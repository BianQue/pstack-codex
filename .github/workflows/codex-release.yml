name: Release accepted Codex package

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/codex' && github.repository == 'BianQue/pstack-codex'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-save --package-lock=false fast-check@4.5.3 commander@14.0.0
      - name: Fetch pinned TLC
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$RUNNER_TEMP/tla2tools.jar"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -
      - name: Test the complete installed suite
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools.jar
        run: node scripts/test-codex.mjs
      - run: node scripts/check-codex.mjs --release
  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Publish immutable tag and verified package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-codex.mjs --release
          version=$(node -p "require('./harness/pstack/codex/plugin.json').version")
          tag="codex-v$version"
          target=$(git rev-parse HEAD)
          mkdir release
          git archive --format=zip --prefix=pstack-codex/ \
            -o "release/pstack-codex-$version.zip" HEAD:harness/pstack/codex
          (cd release && sha256sum "pstack-codex-$version.zip" > SHA256SUMS)
          cp codex/acceptance.json release/acceptance.json
          printf 'Complete pstack suite for Codex %s: all 58 published skills, 23 internal playbooks, scripts, guides, agents, assets and dormant Benny resources. See CODEX.md at this tag for installation, prerequisites, verification and rollback. The accepted model settings are gpt-6.1-sol / xhigh; backend identity is not independently attested. External integrations retain their stated prerequisites.\n' "$version" > release/notes.md
          gh release create "$tag" --target "$target" --title "pstack for Codex $version" \
            --notes-file release/notes.md \
            "release/pstack-codex-$version.zip" release/SHA256SUMS release/acceptance.json
